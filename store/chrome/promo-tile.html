     The Chrome Web Store's small promo tile, 440x280 (tools/store-shots.mjs). Colours from the popup and the
     highlights it paints. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Text Find+ promo tile</title>
  <style>
    html, body { margin: 0; }
    body {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 22px;
      width: 440px;
      height: 280px;
      padding: 0 26px;
      overflow: hidden;
      background: #eaf2fd;
      color: #1d1d1f;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    img { flex: none; width: 128px; height: 128px; }
    h1 { margin: 0 0 12px; font-size: 32px; line-height: 1.1; letter-spacing: -0.02em; white-space: nowrap; }
    p { margin: 0; font-size: 17px; line-height: 1.5; }
    p + p { margin-top: 8px; font-size: 15px; color: #6e6e73; }
    mark { padding: 0 2px; border-radius: 3px; background: #ffe45c; color: #000; }
    mark.current { background: #ff9632; }
  </style>
</head>
<body>
  <img src="../../src/icons/icon128.png" alt="">
  <div>
    <h1>Text Find+</h1>
    <p>Find <mark>words</mark> or <mark class="current">regex</mark><br>on any page.</p>
    <p>Runs only when you click it.</p>
  </div>
</body>
</html>
