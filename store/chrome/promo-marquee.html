     The Chrome Web Store's marquee promo tile, 1400x560 (tools/store-shots.mjs, after screenshot-1-words.png, which
     it shows). Colours from the popup and the highlights it paints, as in the small tile. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Text Find+ marquee promo tile</title>
  <style>
    html, body { margin: 0; }
    body {
      position: relative;
      width: 1400px;
      height: 560px;
      overflow: hidden;
      background: #eaf2fd;
      color: #1d1d1f;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .text {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 72px;
      width: 520px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 26px; }
    .brand img { flex: none; width: 128px; height: 128px; }
    h1 { margin: 0; font-size: 64px; line-height: 1.1; letter-spacing: -0.02em; white-space: nowrap; }
    p { margin: 0; font-size: 36px; line-height: 1.5; }
    p + p { margin-top: 16px; font-size: 28px; color: #6e6e73; }
    mark { padding: 0 0.12em; border-radius: 0.18em; background: #ffe45c; color: #000; }
    mark.current { background: #ff9632; }
    /* The first store screenshot (the popup over the demo page) at 21/32 of its size, cropped to the article and the
       popup, in a window frame that runs off the bottom edge. */
    .shot {
      position: absolute;
      top: 48px;
      right: 48px;
      width: 766px;
      height: 560px;
      overflow: hidden;
      border-radius: 14px 14px 0 0;
      box-shadow: 0 18px 50px rgba(30, 60, 120, 0.22), 0 2px 8px rgba(30, 60, 120, 0.12);
    }
    .shot img { display: block; width: 840px; height: 525px; margin-left: -72px; }
  </style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../../src/icons/icon128.png" alt=""><h1>Text Find+</h1></div>
    <p>Find <mark>words</mark> or <mark class="current">regex</mark><br>on any page.</p>
    <p>Privacy-respecting: runs only when you click it, only on that specific tab.</p>
  </div>
  <div class="shot"><img src="screenshot-1-words.png" alt=""></div>
</body>
</html>
